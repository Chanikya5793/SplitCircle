plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.splitcirclecrypto'
version = '0.1.0'

android {
  namespace "expo.modules.splitcirclecrypto"
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// Fail with the remedy rather than a bare "Could not find org.signal:...".
// These artifacts are ~63MB, built from source, and deliberately not committed;
// scripts/build-libsignal-android.sh is the distribution mechanism.
def libsignalAar = new File(System.getProperty('user.home'),
    '.m2/repository/org/signal/libsignal-android/0.99.1/libsignal-android-0.99.1.aar')
if (!libsignalAar.exists()) {
    throw new GradleException("""
  libsignal 0.99.1 is not installed in ~/.m2, so the Android crypto module
  cannot build.

  Run:  bash scripts/build-libsignal-android.sh

  Why it is not just a Maven coordinate: iOS pins LibSignalClient 0.99.1, and
  Maven Central's Android artifact stops at 0.86.5 with an incompatible API.
  See ai_layer/docs/33 §3.1.
""")
}

dependencies {
  // Built from signalapp/libsignal at tag v0.99.1 — the EXACT version
  // ios/Podfile.lock pins for LibSignalClient. Maven Central cannot supply it
  // (its Android artifact stops at 0.86.5, published 2025-11-17), and the API
  // changed materially in between (SessionBuilder/SessionCipher each gained an
  // address parameter), so matching versions is not merely tidy.
  //
  // Consumed from mavenLocal, NOT as files('libs/*.aar'): an Expo module is an
  // Android library, and AGP rejects a direct local .aar dependency in one —
  // the produced AAR would silently omit those classes.
  //
  // Reproduce (ai_layer/docs/33 §3.1): Rust nightly-2026-07-15 (repo-pinned)
  // + android targets, NDK 28.0.13004108 exactly, cmake from the SDK on PATH,
  // CXX_* for the target (build_jni.sh exports only CC_*), protoc, JDK 21:
  //   cd libsignal/java && ./gradlew :android:assembleRelease -PandroidArchs=arm64
  // then install the .aar and the libsignal-client .jar into ~/.m2. BOTH are
  // required: the aar's own classes.jar is a 14KB Android shim, the Java API
  // lives in the client jar.
  implementation 'org.signal:libsignal-android:0.99.1'
}
