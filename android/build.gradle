// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    // FCM (doc 36). Without this plugin `google-services.json` is an inert
    // file: nothing reads it, no google-services resources are generated, and
    // the app can never obtain a push token. Android notifications had NEVER
    // worked for this reason — there was also no Android app registered in the
    // Firebase project at all until 2026-08-03.
    classpath('com.google.gms:google-services:4.4.2')
  }
}

allprojects {
  repositories {
    // SPIKE (ai_layer/docs/33 §3.1): libsignal 0.99.1 is built from source and
    // installed to ~/.m2, because Maven Central's Android artifact stops at
    // 0.86.5 while iOS pins 0.99.1. Listed FIRST so the local build wins.
    // NOTE: android/ is generated, so this does not survive expo prebuild —
    // the real implementation needs a config plugin.
    mavenLocal()
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
